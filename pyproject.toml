[project]
name = "llm-project"
version = "0.1.0"
description = "LLM project for course 1RT730"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "langgraph>=1,<2",
    "langchain-core>=1,<2",
    "langchain-ollama>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
claim-demo = "app.demo:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
