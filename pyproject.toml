[project]
name = "llm-project"
version = "0.1.0"
description = "LLM project for course 1RT730 - Paper correlation analysis with LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.0.1",
    "langchain-core>=0.1.0",
    "langsmith>=0.0.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",
    "numpy",
    "torch",
    "transformers",
    "datasets",
    "tqdm",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
